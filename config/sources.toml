# Source registry. Adding a feed, ATS board or company here needs no code change.

[startups.yc]
name = "Y Combinator Directory"
# Community mirror of YC's public directory index (refreshed daily). Every record
# links to — and is verified against — its live ycombinator.com/companies page.
index_url = "https://yc-oss.github.io/api/companies/all.json"
verify_live_pages = true

[products.show_hn]
name = "Hacker News (Show HN)"
api = "https://hn.algolia.com/api/v1/search_by_date"
queries = ["AI", "LLM", "GPT", "agent", "AI-powered", "machine learning", "Claude", "chatbot", "copilot", "RAG", "voice AI", "AI assistant"]
min_points = 3

[products.product_hunt]   # used only if PRODUCT_HUNT_TOKEN is set
name = "Product Hunt"
topic = "artificial-intelligence"

[papers.huggingface]
name = "Hugging Face Papers"   # Papers with Code's successor (PwC redirects here)
api = "https://huggingface.co/api/daily_papers"
max_days_back = 365

# ----------------------------------------------------------------- Phase II: news
[[news]]
name = "TechCrunch AI"
feed = "https://techcrunch.com/category/artificial-intelligence/feed/"

[[news]]
name = "VentureBeat AI"
feed = "https://venturebeat.com/category/ai/feed/"

[[news]]
name = "The Verge AI"
feed = "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"

[[news]]
name = "MIT Technology Review AI"
feed = "https://www.technologyreview.com/topic/artificial-intelligence/feed"

[[news]]
name = "Ars Technica AI"
feed = "https://arstechnica.com/ai/feed/"

